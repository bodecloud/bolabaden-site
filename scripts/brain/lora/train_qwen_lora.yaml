# LLaMA-Factory QLoRA — operator config for Boden SFT export
# Requires GPU (HF Jobs recommended). Run only after ITT human ranking pass.

model_name_or_path: Qwen/Qwen2.5-7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_target: all
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05

dataset: boden_sft
dataset_dir: .
template: qwen
cutoff_len: 4096
max_samples: 7121
overwrite_cache: true
preprocessing_num_workers: 4

output_dir: ./boden-qwen-lora
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true

val_size: 0.05
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 500
