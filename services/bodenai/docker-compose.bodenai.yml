# Twin depends on brain service
services:
  bodenai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bodenai
    ports:
      - "8091:8091"
    environment:
      BRAIN_BASE_URL: ${BRAIN_BASE_URL:-http://brain:8090}
      BRAIN_SERVICE_TOKEN: ${BRAIN_SERVICE_TOKEN:-}
      BODENAI_SERVICE_TOKEN: ${BODENAI_SERVICE_TOKEN:-}
      BODENAI_LLM_BASE_URL: ${BODENAI_LLM_BASE_URL:-}
      BODENAI_LLM_API_KEY: ${BODENAI_LLM_API_KEY:-}
      BODENAI_LLM_MODEL: ${BODENAI_LLM_MODEL:-gpt-4o-mini}
      BODENAI_GATE_THRESHOLD: ${BODENAI_GATE_THRESHOLD:-0.8}
      BODENAI_DECISION_MODE: ${BODENAI_DECISION_MODE:-pfc_loop}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
